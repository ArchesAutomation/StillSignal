name: Prepare Cloudflare migration
on:
  push:
    branches: [codex/cloudflare-migration]
    paths: [.github/workflows/prepare-cloudflare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check compatibility and initialize Cloudflare
        run: npx --yes vinext@1.4.3 init --platform=cloudflare --name still-signal --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender --no-warm-cache
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Commit generated configuration and locked dependencies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json vite.config.* cloudflare.config.ts .gitignore
          git diff --cached --quiet || git commit -m "Configure Still Signal for Cloudflare Workers with vinext"
          git push origin HEAD:codex/cloudflare-migration
      - run: npm run typecheck
      - run: npm test
      - name: Build the Cloudflare Worker
        run: npm run build:vinext
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ipfurgwqqjkybhadzutj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable__fpJ9lveEiikBfkUMG9_KA_44exOsay
          NEXT_TELEMETRY_DISABLED: 1
