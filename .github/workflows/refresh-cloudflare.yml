name: Refresh Cloudflare migration assets
on:
  push:
    branches: [codex/cloudflare-migration]
    paths: [.github/workflows/refresh-cloudflare.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm run build:extension
      - name: Package extension for Cloudflare
        run: |
          cd extension/dist
          zip -qr ../../public/trade-pulse-voice-extension.zip .
      - name: Commit lockfile and extension
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/trade-pulse-voice-extension.zip
          git diff --cached --quiet || git commit -m "Lock Workers dependencies and package extension for Cloudflare origin"
          git push origin HEAD:codex/cloudflare-migration
