project_id = "TraderPulse"

[edge_runtime]
# Each request runs in a fresh worker. With the default per_worker policy a worker is
# reused until its lifetime CPU budget (1 s soft, 2 s hard locally) runs out, and a
# streaming answer still in flight when it is ended is cut off. Edits to function
# source still apply on the next request.
policy = "oneshot"

[functions.pulse-data]
verify_jwt = false

[functions.pulse-tradingview]
verify_jwt = false

[functions.pulse-brokers]
verify_jwt = false

[functions.pulse-market]
verify_jwt = false

[functions.pulse-broker-webhook]
verify_jwt = false

[functions.pulse-extension]
verify_jwt = false

[functions.pulse-process]
verify_jwt = false

[functions.pulse-assistant]
# The handler verifies the session itself and returns 404 unless the local prototype or the
# allowlisted pilot is enabled. Deploy only by following docs/assistant-pilot.md.
verify_jwt = false
