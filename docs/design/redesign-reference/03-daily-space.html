</style></head><body data-theme="studio"><div id="app"></div><script>const theme=document.body.dataset.theme;
const config={room:{n:'01',name:'The reading room',line:'A little room for you.',sub:'Less noise. More space to notice what matters.',word:'Begin gently.'},sanctuary:{n:'02',name:'The quiet hours',line:'Come back to yourself.',sub:'You can care about your day without carrying all of it.',word:'Find your stillness.'},studio:{n:'03',name:'Your daily space',line:'Your day. At your pace.',sub:'Prepare with intention. Notice along the way. Leave with perspective.',word:'Make space for today.'}}[theme];
const KEY='stillsignal-design-'+theme;
const seed={prep:['waiting'],done:['release'],saved:{prep:[],done:[]},notes:[{text:'I noticed the urge to rush. Giving it a little space helped me return to what I had chosen.',title:'A moment of awareness',time:'10:42',type:'Reflection',prompt:'What helped me pause?'}],glass:false,focus:['Impatience'],checks:[],intention:'',outcome:'',process:'',week:''};
let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{state=structuredClone(seed)}
let page='Home',selected='waiting',filter='All',search='',tags=[],step=0,practice=null,returnPage='Stillness',editorPrompt='',editMode=false,elapsed=0,paused=false,interval=null,undoState=null;
const pieces=[
 {id:'waiting',name:'Make room for waiting',kind:'Experience',duration:'3 min',tags:['Impatience','Impulsiveness'],color:'purple',desc:'When you feel pulled to act, make a little space between the urge and your next decision.',steps:[['Arrive in your body','Feel your feet resting on the floor. Notice the support of the chair. You do not need to change anything yet.'],['Let the urge be here','The urge to act is something you can notice before it becomes something you follow. Let it be present for a moment.'],['Return to choice','What would help you wait for a decision you actually want to make? You can act, wait, or step away.']],question:'What did you notice between the urge and your next choice?'},
 {id:'release',name:'Leave the result here',kind:'Experience',duration:'4 min',tags:['Fear','Greed'],color:'pink',desc:'A gentle close to the day, with room for the result and the person behind it.',steps:[['The day can end','Feel your feet on the floor. The session is finished. Nothing needs to be solved in this minute.'],['Separate the result from yourself','A result is something that happened. It does not have to become a verdict about you.'],['Carry one thing forward','What is one thing you want to keep, and one thing you are ready to put down?']],question:'What can you leave here, and what would you like to carry forward?'},
 {id:'body',name:'Back to the room',kind:'Practice',duration:'1 min',tags:['Fear','Impulsiveness'],color:'green',desc:'A simple grounding practice. No breath holds, no particular feeling required.',steps:[['Back to the room','Notice one thing you can see, one thing you can hear, and the contact of your feet with the floor.']],question:'What is here now that you have paused?'},
 {id:'enough',name:'Enough is a choice',kind:'Reminder',duration:'20 sec',tags:['Greed','Impatience'],color:'pink',desc:'A few words for the moment when you want just a little more.',steps:[['Enough is a choice','You can want more and still respect the limits you chose. You do not need to act on every possibility.']],question:'What would respecting enough look like today?'},
 {id:'awareness',name:'Open awareness',kind:'Practice',duration:'2 min',tags:['Fear','Impatience'],color:'purple',desc:'An existing StillSignal practice, given its own clear place in the library.',steps:[['Notice, without solving','Notice contact with the chair and floor. Notice a thought without solving it. Notice any urge to act. Allow the experience to be here.']],question:'What did you notice without needing to solve it?'},
 {id:'identity',name:'More than this moment',kind:'Reminder',duration:'20 sec',tags:['Fear','Impulsiveness'],color:'green',desc:'A reminder that a single decision does not describe all of you.',steps:[['More than this moment','Describe the behaviour precisely. Leave your identity out of the verdict. You are allowed to learn without making yourself the problem.']],question:'What happened, described without judging who you are?'}
];
const $=s=>document.querySelector(s), item=id=>pieces.find(x=>x.id===id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={Home:'⌂',Preparation:'◒',Stillness:'◌','Done for the day':'◐',Journal:'▤'};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Browser storage unavailable. Keep this tab open to retain your changes.')}}
function btn(label,action,cls='',extra=''){return `<button class="${cls}" data-action="${action}" ${extra}>${label}</button>`}
function art(color='purple',small=false){return `<div class="art ${color} ${small?'small':''}" aria-hidden="true"><i></i><i></i><i></i><span>✳</span></div>`}
function chips(values,action,active){return values.map(v=>btn(esc(v),action,'chip '+(active.includes(v)?'on':''),`data-value="${esc(v)}" aria-pressed="${active.includes(v)}"`)).join('')}
function heading(k,h,p,side=''){return `<div class="page-heading"><div><div class="eyebrow">${k}</div><h1>${h}</h1><p>${p}</p></div>${side}</div>`}
function render(){document.body.classList.toggle('glass',state.glass);document.title=`StillSignal · ${config.name} · ${page}`;$('#app').innerHTML=`<div class="designbar"><a href="index.html">← Compare directions</a><span>${config.n} / ${config.name}</span><span>LOCAL PROTOTYPE · SAMPLE DATA</span></div><div class="shell"><aside class="sidebar"><a class="brand" href="#Home"><span class="brandmark">∿</span> stillsignal<span class="dot">.</span></a><p class="sidecaption">A little space for you</p><nav aria-label="Main navigation">${Object.keys(icons).map(n=>btn(`<span>${icons[n]}</span>${n}${n==='Preparation'?'<small>'+state.prep.length+'</small>':''}`, 'nav',page===n?'active':'',`data-page="${n}"`)).join('')}</nav><div class="side-bottom">${btn('↗ Capture a moment','capture','plain')} ${btn('◷ Weekly reflection','weekly','plain')} ${btn('⚙ Make this space yours','settings','plain')}<div class="profile"><span>C</span><div>Caleb<small>Your private space</small></div></div></div></aside><main><header class="topline"><span>Tuesday, 10 November <span class="muted">/ Your space</span></span><div>${btn('◫ Edit dashboard','layout','subtle')} ${btn(state.glass?'Glass on':'Glass off','glass','subtle',`aria-pressed="${state.glass}"`)}</div></header><div class="content">${page==='Home'?home():page==='Stillness'?library():page==='Preparation'?daily('prep'):page==='Done for the day'?daily('done'):journal()}</div><footer>Awareness before action.<span>No wearable needed. No particular feeling required.</span></footer></main></div><button class="floating" data-action="capture"><span class="record-dot"></span> Capture a moment <span>＋</span></button><dialog id="modal"></dialog><div id="toast" role="status"></div>`;}
function home(){return `<section class="home-hero"><div class="hero-copy"><div class="eyebrow">WELCOME BACK, CALEB</div><h1>${config.line}</h1><p>${config.sub}</p><div class="actions">${btn('Begin preparation <span>↗</span>','nav','primary','data-page="Preparation"')}${btn('Explore Stillness →','nav','textbutton','data-page="Stillness"')}</div><div class="hero-note"><span class="status-dot"></span> Your journal is here whenever you need it.</div></div><div class="hero-art">${art('purple')}<span class="art-caption">Notice. Make space. Choose.</span></div></section><div class="sectionline"><h2>A rhythm for your day</h2><span>Support, not another to-do list</span></div><div class="day-grid"><button class="day-card surface" data-action="nav" data-page="Preparation"><span class="number">01 / ARRIVE</span><span class="card-icon purple">◒</span><h2>Preparation</h2><p>A short check-in. Your chosen support. An intention to return to.</p><div class="card-bottom">${state.prep.length} experience for today <b>↗</b></div></button><button class="day-card surface" data-action="nav" data-page="Journal"><span class="number">02 / NOTICE</span><span class="card-icon green">▤</span><h2>Your journal</h2><p>Words, voice and chart captures. A connected record of your day.</p><div class="card-bottom">${state.notes.length} moments in this example <b>↗</b></div></button><button class="day-card surface" data-action="nav" data-page="Done for the day"><span class="number">03 / LET GO</span><span class="card-icon pink">◐</span><h2>Done for the day</h2><p>Leave space between the result, your process and how you see yourself.</p><div class="card-bottom">Close at your own pace <b>↗</b></div></button></div><div class="home-lower"><section class="featured surface"><div><div class="eyebrow">FROM THE STILLNESS LIBRARY</div><h2>When waiting feels difficult.</h2><p>You don’t have to make the urge disappear to choose what happens next.</p>${btn('Preview Make room for waiting →','preview-link','textbutton','data-id="waiting"')}</div>${art('green',true)}</section><section class="weekly surface"><div class="eyebrow">THE WEEK AS A WHOLE</div><h2>What supported you?</h2><p>A gentle look back at the moments you chose to keep.</p>${btn('Open weekly reflection →','weekly','textbutton')}</section></div>`}
function library(){const p=item(selected);return `${heading('STILLNESS / YOUR SUPPORT LIBRARY','Find what meets you here.','Ready-made reminders, practices and complete experiences. Try something before making it yours.')}<div class="library-tools"><label class="search">⌕ <input id="search" aria-label="Search support" placeholder="Search for a feeling, a practice, a little perspective…" value="${esc(search)}"></label><div class="chips">${chips(['Impulsiveness','Impatience','Fear','Greed'],'tag',tags)}</div></div><div class="library-layout"><section><div class="library-tabs" role="group" aria-label="Content type">${chips(['All','Experience','Practice','Reminder'],'filter',[filter])}</div><div id="results">${cards()}</div><div class="personal-note"><span>＋</span><div><h3>Your words belong here too.</h3><p>Add a personal reminder or recording when you want to.</p></div>${btn('Add your own','personal','subtle')}</div></section><aside class="preview surface"><div class="eyebrow">A CLOSER LOOK <span>↗</span></div>${art(p.color,true)}<div class="meta">${p.kind} · ${p.duration} · ${p.steps.length} ${p.steps.length===1?'piece':'pieces'}</div><h2>${p.name}</h2><p>${p.desc}</p><div class="taglabels">${p.tags.join(' · ')}</div><ol class="sequence">${p.steps.map((s,i)=>`<li><button data-action="piece" data-index="${i}"><span>${i+1}</span><div>${s[0]}<small>${i===p.steps.length-1?'An invitation to reflect':'Preview this piece'}</small></div><b>↗</b></button></li>`).join('')}</ol><div class="preview-actions">${btn('Try '+(p.kind==='Experience'?'experience':p.kind.toLowerCase()),'try','primary')}${btn('＋ Add to my day','add','secondary')}</div><small class="quiet">Preview freely. Your daily routine won’t change until you add it.</small></aside></div>`}
function cards(){const list=pieces.filter(p=>(filter==='All'||p.kind===filter)&&(!tags.length||tags.some(t=>p.tags.includes(t)))&&(!search||`${p.name} ${p.desc} ${p.tags.join(' ')}`.toLowerCase().includes(search.toLowerCase())));return `<div class="library-count">${list.length} ways to make a little space <span>ORIGINAL STILL SIGNAL SUPPORT</span></div><div class="support-grid">${list.map(p=>`<button class="support-card surface ${p.id===selected?'selected':''}" data-action="select" data-id="${p.id}" aria-pressed="${p.id===selected}">${art(p.color,true)}<div class="support-card-copy"><div class="meta">${p.kind} <span>· ${p.duration}</span></div><h3>${p.name}</h3><p>${p.desc}</p><div class="card-bottom">${p.tags[0]} <b>↗</b></div></div></button>`).join('')||'<div class="surface empty">Nothing matches yet. Try another word or remove a filter.</div>'}</div>`}
function daily(kind){let prep=kind==='prep';return `${heading(prep?'PREPARATION / ARRIVE':'DONE FOR THE DAY / LET GO',prep?'Before the next decision.':'You can put the day down.',prep?'A little support for the person making the decisions.':'The result is part of your day. It isn’t all of it.',btn('＋ Find support','nav','secondary','data-page="Stillness"'))}<div class="daily-layout"><aside class="daily-rail"><span class="eyebrow">TODAY’S PATH</span><div class="rail-row"><i>1</i><div>${prep?'Check in with yourself':'Name the day'}<small>${prep?'A few words is enough':'Outcome belongs here'}</small></div></div><div class="rail-row"><i>2</i><div>Your chosen support<small>${state[kind].length} ${state[kind].length===1?'experience':'experiences'}</small></div></div><div class="rail-row"><i>3</i><div>${prep?'Choose an intention':'Reflect, if you want'}<small>Always optional</small></div></div><div class="rail-note">${prep?'Initial setup lives in “Make this space yours”. You don’t need to repeat it each morning.':'Closing the day doesn’t require a trade, a recording or a completed checklist.'}</div></aside><div class="daily-main"><section class="surface checkin"><div class="sectionline"><span class="eyebrow">01 / ${prep?'ARRIVE':'YOUR DAY'}</span><span class="pill">Optional</span></div><h2>${prep?'How are you arriving?':'How did today turn out?'}</h2><p>${prep?'Choose anything that fits. You can feel more than one thing.':'Keep what happened separate from how you treated your process.'}</p><div class="chips">${prep?chips(['Settled','Restless','Tired','Uncertain','Hopeful'],'check',state.checks):chips(['Profit','Loss','Breakeven','No trade','Rather not say'],'outcome',[state.outcome])}</div>${prep?'':`<h3>And your process?</h3><div class="chips">${chips(['Followed my rules','Partly followed','Not followed','Not reviewed'],'process',[state.process])}</div>`}</section><div class="sectionline"><h2>02 / Your support for today</h2><span>Change today without changing every day</span></div>${state[kind].map(id=>{const p=item(id);return `<article class="routine-row surface">${art(p.color,true)}<div><div class="meta">${p.kind} · ${p.duration}</div><h3>${p.name}</h3><p>${p.steps.map(s=>s[0]).join(' → ')}</p><div class="actions">${btn('Begin →','begin','primary',`data-id="${id}"`)}${btn('Customise','customise','textbutton',`data-id="${id}"`)}${btn('Remove for today','remove','textbutton',`data-id="${id}" data-kind="${kind}"`)}</div></div></article>`}).join('')||`<div class="surface empty"><h3>Space for what you need.</h3><p>You haven’t added support here today.</p>${btn('Explore the library →','nav','secondary','data-page="Stillness"')}</div>`}<section class="surface intention"><div class="eyebrow">03 / ${prep?'YOUR INTENTION':'A LITTLE PERSPECTIVE'}</div><h2>${prep?'What would you like to return to?':'Anything you want to keep?'}</h2><p>${prep?'A sentence, a boundary, or permission to step away.':'Write or speak a reflection. You can also finish without one.'}</p>${prep?`<textarea id="intention" aria-label="Today’s intention" placeholder="Today, I want to give myself permission to…">${esc(state.intention)}</textarea><div class="actions">${btn('Keep this intention','intention','primary')}${btn('Open my journal →','nav','textbutton','data-page="Journal"')}</div>`:`<div class="actions">${btn('Write a reflection','reflect','primary')}${btn('Speak instead','speak','secondary')}${btn('Finish without writing','finishday','textbutton')}</div>`}</section></div></div>`}
function chart(){return `<div class="chart" aria-label="Illustrative session timeline, sample data"><div class="chart-axis"><span>SESSION MOMENTS</span><span>DEMONSTRATION · NO LIVE HR</span></div><svg viewBox="0 0 800 130" preserveAspectRatio="none" role="img" aria-label="Sample timeline with journal markers"><defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="currentColor" stop-opacity=".2"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs><path d="M0 98L40 80L75 93L110 69L140 76L170 45L200 73L240 61L280 83L320 44L355 66L390 30L420 70L460 49L500 83L540 71L580 52L620 68L660 30L700 57L750 42L800 65V130H0Z" fill="url(#fade)"/><path d="M0 98L40 80L75 93L110 69L140 76L170 45L200 73L240 61L280 83L320 44L355 66L390 30L420 70L460 49L500 83L540 71L580 52L620 68L660 30L700 57L750 42L800 65" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="170" cy="45" r="5" fill="currentColor"/><circle cx="390" cy="30" r="5" fill="currentColor"/><circle cx="660" cy="30" r="5" fill="currentColor"/></svg><div class="chart-axis"><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span></div></div>`}
function journal(){return `${heading('JOURNAL / CONNECTED MOMENTS','Your day, in your words.','Your reflections, recordings and available evidence, together.',btn('＋ Add a moment','capture','primary'))}<div class="journal-layout"><aside class="journal-side surface"><div class="eyebrow">NOVEMBER 2026</div><div class="week-strip">${['M 9','T 10','W 11','T 12','F 13'].map((x,i)=>`<span class="${i===1?'chosen':''}">${x.split(' ')[0]}<b>${x.split(' ')[1]}</b></span>`).join('')}</div><hr><div class="eyebrow">TODAY’S REFERENCE</div><h3>Your intention</h3><p>${esc(state.intention)||'Notice the urge before following it.'}</p><h3>How you arrived</h3><p>${state.checks.join(' · ')||'Not recorded in this example'}</p><div class="pill">${state.notes.length} saved moments</div>${btn('Weekly reflection →','weekly','textbutton')}</aside><div><section class="surface timeline"><div class="sectionline"><h2>The rhythm of your session</h2>${btn('Chart layers','layers','subtle')}</div>${chart()}<small>Existing journal concept retained: moments, timeline and evidence. This chart is illustrative.</small></section><div class="sectionline"><h2>Moment by moment</h2><span>Tuesday, 10 November</span></div>${state.notes.map((n,i)=>`<article class="surface journal-note"><div class="note-time">${esc(n.time)}<span>◌</span></div><div><div class="meta">${esc(n.type)} · ${esc(n.section||'Whole day')}</div><h3>${esc(n.title)}</h3>${n.prompt?`<p class="prompt">${esc(n.prompt)}</p>`:''}<p class="note-text">${esc(n.text)}</p>${n.image?'<div class="pill">Image attached · retained for this session</div>':''}${n.type==='Voice reflection'?'<div class="pill">Voice interaction demonstrated · no real audio recorded</div>':''}${btn('View moment & evidence →','evidence','textbutton',`data-index="${i}"`)}</div></article>`).join('')}</div></div>`}
function modal(html){const d=$('#modal');d.innerHTML=btn('×','close','close','aria-label="Close dialog"')+html;d.showModal();}
function toast(t,undo=false){$('#toast').innerHTML=`${esc(t)} ${undo?btn('Undo','undo','textbutton'):''}`;$('#toast').classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast')?.classList.remove('show'),8000)}
function addPanel(id=selected,pieceIndex=null){selected=id;const p=item(id);modal(`<div class="eyebrow">MAKE A LITTLE SPACE</div><h2>Add ${pieceIndex===null?esc(p.name):esc(p.steps[pieceIndex][0])}</h2><p>${pieceIndex===null?'The sequence stays together. You can skip steps or customise it later.':'Add this individual piece without the rest of the sequence.'}</p><form id="add-form"><fieldset><legend>Where would you like it?</legend><label class="choice"><input type="radio" name="destination" value="prep" checked> Preparation <small>Before the day’s decisions</small></label><label class="choice"><input type="radio" name="destination" value="done"> Done for the day <small>A little space to close</small></label></fieldset><label class="choice"><input type="checkbox" name="future"> Also save to my routine <small>Otherwise this is just for today.</small></label><button class="primary" type="submit">Add for today →</button></form>`);$('#add-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),kind=f.get('destination');undoState=structuredClone(state);let addId=id;if(pieceIndex!==null){addId=`${id}-piece-${pieceIndex}`;if(!item(addId))pieces.push({...p,id:addId,name:p.steps[pieceIndex][0],kind:'Reminder',steps:[p.steps[pieceIndex]],duration:'1 min'})}if(!state[kind].includes(addId))state[kind].push(addId);if(f.has('future')&&!state.saved[kind].includes(addId))state.saved[kind].push(addId);save();$('#modal').close();render();toast(`Added to today’s ${kind==='prep'?'Preparation':'Done for the day'}${f.has('future')?' and saved routine':''}.`,true)}}
function run(id,fromPreview=false){practice=item(id);step=0;elapsed=0;paused=false;returnPage=page;practice.preview=fromPreview;showPractice()}
function showPractice(){clearInterval(interval);const s=practice.steps[step];modal(`<div class="practice-dialog"><div class="eyebrow">${practice.preview?'PREVIEW':'YOUR PRACTICE'} / ${esc(practice.name)}</div><div class="stepdots">${practice.steps.map((s,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div><div class="practice-orb" aria-hidden="true">◌</div><div class="meta">${step+1} OF ${practice.steps.length} · AT YOUR PACE</div><h2>${esc(s[0])}</h2><p class="instruction">${esc(state.custom?.[practice.id]?.[step]||s[1])}</p><span id="practice-time">Take the time you need</span><div class="actions">${btn('Pause','pause','secondary')}${btn(step===practice.steps.length-1?'Finish practice →':'Continue →','next-step','primary')}</div>${btn('Skip this step','skip-step','textbutton')}<small>No particular feeling is required. You can stop whenever you want.</small></div>`);interval=setInterval(()=>{if(!paused){elapsed++;const t=$('#practice-time');if(t)t.textContent=`${elapsed}s of space · continue whenever you like`}},1000)}
function practiceEnd(){clearInterval(interval);modal(`<div class="practice-dialog">${art('green',true)}<div class="eyebrow">A LITTLE SPACE, TAKEN</div><h2>Anything you want to keep?</h2><p>${esc(practice.question)}</p><div class="actions">${btn('Write a reflection','practice-reflect','primary')}${btn('Speak instead','speak','secondary')}</div>${practice.preview?btn('Add this experience','add','textbutton'):''}${btn('Continue without writing','close','textbutton')}<small>Finishing a practice does not record an emotion or a journal entry.</small></div>`)}
function editor(voice=false){modal(`<div class="eyebrow">${voice?'VOICE REFLECTION / INTERACTION DEMO':'A MOMENT FOR YOUR JOURNAL'}</div><h2>${voice?'Say it in your own way.':'What would you like to keep?'}</h2><p>${esc(editorPrompt||'A thought, a feeling, a sensation or an urge. A few words is enough.')}</p>${voice?'<div class="voice-demo"><span class="record-dot"></span> Microphone is not active. Use a sample transcript or type below.</div>':''}<form id="note-form"><label class="field">Your reflection<textarea name="text" required aria-label="Your reflection" placeholder="There’s no right way to put it…"></textarea></label><div class="actions">${voice?btn('Use sample transcript','sample','secondary'):btn('Speak instead','speak','secondary')}<label class="file-label">＋ Attach screenshot<input type="file" accept="image/*" id="attachment"></label></div><p id="attachment-status" class="quiet"></p><label class="field">Save to<select name="section"><option>Whole day</option><option>Preparation</option><option>Done for the day</option></select></label><button class="primary" type="submit">Save to local journal →</button></form><small class="quiet">Prototype only. This does not write to your StillSignal account.</small>`);$('#note-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.notes.unshift({text:f.get('text'),section:f.get('section'),title:practice?practice.name:'A moment of awareness',time:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),type:voice?'Voice reflection':'Reflection',prompt:editorPrompt,image:!!$('#attachment').files.length});save();page='Journal';render();toast('Saved to this prototype’s journal.');practice=null;editorPrompt=''};$('#attachment').onchange=()=>$('#attachment-status').textContent=$('#attachment').files[0]?.name||''}
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;$('#results').innerHTML=cards()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,v=b.dataset.value;
 if(a==='nav'){clearInterval(interval);practice=null;page=b.dataset.page;render();window.scrollTo(0,0)}
 if(a==='select'){practice=null;selected=id;render()}
 if(a==='tag'){tags=tags.includes(v)?tags.filter(t=>t!==v):[...tags,v];render()}
 if(a==='filter'){filter=v;render()}
 if(a==='preview-link'){selected=id;page='Stillness';render()}
 if(a==='close'){clearInterval(interval);$('#modal').close()}
 if(a==='glass'){state.glass=!state.glass;save();render()}
 if(a==='add')addPanel(practice?.id||selected);
 if(a==='try')run(selected,true);
 if(a==='begin')run(id);
 if(a==='next-step'||a==='skip-step'){if(step+1<practice.steps.length){step++;showPractice()}else practiceEnd()}
 if(a==='pause'){paused=!paused;b.textContent=paused?'Resume':'Pause';$('.practice-orb').style.animationPlayState=paused?'paused':'running'}
 if(a==='piece'){const i=Number(b.dataset.index),p=item(selected);modal(`<div class="eyebrow">INDIVIDUAL PIECE / FROM ${esc(p.name)}</div><h2>${esc(p.steps[i][0])}</h2><p class="instruction">${esc(p.steps[i][1])}</p>${btn('Add this piece','add-piece','primary',`data-index="${i}"`)} ${btn('Back to sequence','close','textbutton')}`)}
 if(a==='add-piece')addPanel(selected,Number(b.dataset.index));
 if(a==='remove'){undoState=structuredClone(state);state[b.dataset.kind]=state[b.dataset.kind].filter(x=>x!==id);save();render();toast('Removed for today. Your saved routine is unchanged.',true)}
 if(a==='undo'&&undoState){state=undoState;undoState=null;save();render();toast('Change undone.')}
 if(a==='check'){state.checks=state.checks.includes(v)?state.checks.filter(t=>t!==v):[...state.checks,v];save();render()}
 if(a==='outcome'||a==='process'){state[a]=v;save();render()}
 if(a==='intention'){state.intention=$('#intention').value;save();toast('Today’s intention saved in this prototype.')}
 if(a==='capture'||a==='reflect'){practice=null;editorPrompt=page==='Done for the day'?'What would you keep, and what would you change?':'';editor()}
 if(a==='practice-reflect'){editorPrompt=practice.question;editor()}
 if(a==='speak'){editorPrompt=practice?.question||editorPrompt;editor(true)}
 if(a==='sample')$('#note-form textarea').value='I noticed I wanted to rush. I can give myself time before making the next decision.';
 if(a==='finishday'){page='Home';render();toast('The day can be done. No reflection was created.')}
 if(a==='customise'){const p=item(id);modal(`<div class="eyebrow">CUSTOMISE / TODAY’S COPY</div><h2>${esc(p.name)}</h2><p>The sequence stays together. Make the wording yours.</p><form id="custom-form">${p.steps.map((s,i)=>`<label class="field">${esc(s[0])}<textarea name="s${i}">${esc(state.custom?.[id]?.[i]||s[1])}</textarea></label>`).join('')}<button class="primary">Save today’s version</button></form>`);$('#custom-form').onsubmit=e=>{e.preventDefault();state.custom??={};state.custom[id]=p.steps.map((s,i)=>new FormData(e.target).get('s'+i));save();$('#modal').close();toast('Today’s wording saved. Library content is unchanged.')}}
 if(a==='personal'){modal('<div class="eyebrow">YOUR OWN WORDS / OPTIONAL</div><h2>A reminder from you, for you.</h2><form id="personal-form"><label class="field">Title<input name="title" required placeholder="What would you like to hear?"></label><label class="field">Your words<textarea name="words" required></textarea></label><button class="primary">Preview my reminder →</button></form><p class="quiet">Personal recordings can use the existing device-local recording system in a later implementation. No microphone is activated here.</p>');$('#personal-form').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p={id:'personal-'+Date.now(),name:f.get('title'),kind:'Reminder',duration:'1 min',tags:[],color:'green',desc:'Your own reminder.',steps:[[f.get('title'),f.get('words')]],question:'What would you like to remember?'};pieces.push(p);state.personal??=[];state.personal.push(p);save();selected=p.id;page='Stillness';render()}}
 if(a==='weekly'){modal(`<div class="eyebrow">THE WEEK AS A WHOLE</div><h2>What supported you this week?</h2><p>Your moments are a starting point, not a score. What helped? What felt difficult? What would you like more room for?</p><div class="week-summary">${state.notes.length} moments kept in this example · ${state.prep.length+state.done.length} support selections today</div><label class="field">Your weekly reflection<textarea id="week-text">${esc(state.week)}</textarea></label>${btn('Keep this reflection','save-week','primary')}`)}
 if(a==='save-week'){state.week=$('#week-text').value;save();$('#modal').close();toast('Weekly reflection saved in this prototype.')}
 if(a==='settings'){modal(`<div class="eyebrow">INITIAL SETUP / SEPARATE FROM YOUR DAY</div><h2>Make this space yours.</h2><p>What would you like support with? Choose more than one. These are experiences, not labels for you.</p><div class="chips">${chips(['Impulsiveness','Impatience','Fear','Greed'],'setup-focus',state.focus)}</div><hr><h3>Saved for future days</h3><p>Preparation: ${state.saved.prep.map(x=>item(x)?.name).join(', ')||'Nothing saved yet.'}</p><p>Done for the day: ${state.saved.done.map(x=>item(x)?.name).join(', ')||'Nothing saved yet.'}</p><hr><p>Appearance effects are optional. No shark renderer or existing application code has been removed.</p>${btn(state.glass?'Turn glass off':'Try glass surfaces','settings-glass','secondary')}`)}
 if(a==='setup-focus'){state.focus=state.focus.includes(v)?state.focus.filter(x=>x!==v):[...state.focus,v];save();b.classList.toggle('on');b.setAttribute('aria-pressed',state.focus.includes(v))}
 if(a==='settings-glass'){state.glass=!state.glass;save();document.body.classList.toggle('glass',state.glass);b.textContent=state.glass?'Turn glass off':'Try glass surfaces'}
 if(a==='layout'){editMode=!editMode;modal(`<div class="eyebrow">DASHBOARD CUSTOMISATION / LOCAL DEMO</div><h2>Your tools, when you need them.</h2><p>The existing dashboard editor is preserved in the application. Here you can compare a simpler journal with the timeline hidden.</p><label class="choice"><input type="checkbox" id="hide-timeline" ${state.hideTimeline?'checked':''}> Hide session timeline in this prototype</label>${btn('Apply to this preview','apply-layout','primary')}`)}
 if(a==='apply-layout'){state.hideTimeline=$('#hide-timeline').checked;save();$('#modal').close();document.body.classList.toggle('hide-timeline',state.hideTimeline);render()}
 if(a==='layers')modal('<div class="eyebrow">EXISTING JOURNAL CAPABILITY</div><h2>Evidence at your pace.</h2><p>The production journal supports price, heart rate, realised and unrealised P&L, entries, exits and journal moments. This prototype shows an illustrative timeline only.</p>');
 if(a==='evidence'){const n=state.notes[Number(b.dataset.index)];modal(`<div class="eyebrow">MOMENT EVIDENCE / SAMPLE RECORD</div><h2>${esc(n.title)}</h2><p>${esc(n.text)}</p><div class="evidence-placeholder">${n.image?'Image selected in this session. Image bytes are not persisted in this lightweight prototype.':'No screenshot attached to this sample.'}</div><p>Heart-rate context: unavailable. No emotion is inferred.</p>`)}
});
document.addEventListener('cancel',()=>clearInterval(interval),true);
document.addEventListener('close',()=>clearInterval(interval),true);
if(state.personal)pieces.push(...state.personal);
// Rebuild individually saved pieces on reload without altering catalogue originals.
for(const id of [...state.prep,...state.done,...state.saved.prep,...state.saved.done]){if(!item(id)&&id.includes('-piece-')){const [base,i]=id.split('-piece-'),p=item(base);if(p)pieces.push({...p,id,name:p.steps[+i][0],kind:'Reminder',steps:[p.steps[+i]],duration:'1 min'})}}
window.addEventListener('hashchange',()=>{const n=decodeURIComponent(location.hash.slice(1));if(icons[n]){page=n;render()}});
document.body.classList.toggle('hide-timeline',!!state.hideTimeline);
render();
</script></body></html>
